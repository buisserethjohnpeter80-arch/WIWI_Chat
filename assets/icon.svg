<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101a2c"/>
      <stop offset="1" stop-color="#05080f"/>
    </linearGradient>
  </defs>
  <!-- Vector twin of the approved icon (wiwichat-icon-final.png, 2026-11-18):
       bold white W, small white triangle bottom-left, blue Wi-Fi (3 arcs + dot)
       in the app blue #168fff, dark rounded square. -->
  <rect x="2" y="2" width="508" height="508" rx="115" fill="url(#bg)" stroke="#3a4a63" stroke-width="2"/>
  <!-- Wi-Fi symbol, small, above the right peak of the W -->
  <g fill="none" stroke="#168fff" stroke-width="13" stroke-linecap="round">
    <path d="M 304 103 A 30 30 0 0 1 356 103"/>
    <path d="M 288 96 A 55 55 0 0 1 372 96"/>
    <path d="M 272 89 A 80 80 0 0 1 388 89"/>
  </g>
  <circle cx="330" cy="115" r="11" fill="#168fff"/>
  <!-- Bold white W -->
  <polyline points="95,180 190,380 270,190 350,380 440,180" fill="none" stroke="#ffffff" stroke-width="56" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Small white triangle, bottom-left of the W -->
  <polygon points="105,355 162,408 118,452" fill="#ffffff"/>
</svg>
