# WIWIchat — Build Android debug APK
# Add this file to the repo manually at:
#   .github/workflows/android.yml
# (GitHub web: open the branch -> Add file -> Create new file -> paste -> Commit)
# It runs on every push, on pull requests, and manually (Actions -> Run workflow).
# The APK is a DEBUG build for testing on real phones, not a Play Store release.
name: Build Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package.json

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        # --if-present: main (v0.1) has no "test" script yet; the
        # script exists from v0.2 onward, where this step runs the tests.
        run: npm test --if-present

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Generate Android icon and splash from logo
        # assets/icon.svg + assets/splash.svg -> Android launcher icon
        # and splash screen. Runs only when those files exist.
        run: |
          if [ -f assets/icon.svg ]; then npm run assets; else echo "No logo assets yet, keeping default icon."; fi

      - name: Sync Android project
        run: npx cap sync android

      - name: Verify Java version
        run: |
          java -version
          cd android && ./gradlew --version

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WIWIchat-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
